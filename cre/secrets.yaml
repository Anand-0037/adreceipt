# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps a secret ID requested with `runtime.getSecret({ id })` to the
# environment variable holding its value. The Vault DON releases these
# directly into the attested enclave; node operators never see plaintext.
#
# The domain-verification workflow uses no secret: its confidential input is
# the DNS-over-HTTPS response payload, which the enclave protects on its own.
#
# The tier workflow does use one - an advertiser's private off-chain spend -
# and will declare it there.
secretsNames:
  CAMPAIGN_POLICY:
    - CRE_CAMPAIGN_POLICY_JSON
