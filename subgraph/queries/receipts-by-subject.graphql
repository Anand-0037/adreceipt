query ReceiptsBySubject($subjectHash: Bytes!) {
  receipts(first: 2, where: { subjectHash: $subjectHash }, orderBy: blockNumber, orderDirection: desc) {
    id
    campaignId
    subjectHash
    publisher
    payer
    recipient
    asset
    amount
    settledAt
    schemaVersion
    settlementContract
    transactionHash
    logIndex
    blockNumber
    blockTimestamp
  }
  _meta {
    block {
      number
      hash
      timestamp
    }
    hasIndexingErrors
  }
}
