query ReceiptsBySubject($subjectHash: Bytes!, $first: Int = 20, $skip: Int = 0) {
  receipts(
    first: $first
    skip: $skip
    where: { subjectHash: $subjectHash }
    orderBy: blockNumber
    orderDirection: desc
  ) {
    id
    campaignId
    subjectHash
    publisher
    payer
    recipient
    asset
    amount
    settledAt
    schemaVersion
    settlementContract
    transactionHash
    logIndex
    blockNumber
    blockTimestamp
  }
  _meta {
    block {
      number
      hash
      timestamp
    }
    hasIndexingErrors
  }
}
