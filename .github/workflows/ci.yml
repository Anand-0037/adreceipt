name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Unit tests construct providers but never require a live chain endpoint.
      # Keep CI independent from deployment credentials and repository secrets.
      SEPOLIA_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm install --prefix subgraph --no-audit --no-fund
      - run: npm run cre:install
      - run: npm run quality:v1
      - run: npm run verify:all
