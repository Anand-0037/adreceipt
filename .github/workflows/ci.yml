name: ci
on: [push, pull_request]
jobs:
  build:
    # Matchstick 0.6.0 ships a Linux binary for Ubuntu 22.04.
    runs-on: ubuntu-22.04
    env:
      # Unit tests construct providers without contacting a live chain.
      SEPOLIA_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm install --prefix subgraph --no-audit --no-fund
      - run: npm run cre:install
      - run: npm run quality:v1
      - run: npm run verify:all
