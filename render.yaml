services:
  - type: web
    name: adreceipt-api
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Anand-0037/adreceipt
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NETWORK
        value: sepolia
      - key: SEPOLIA_RPC_URL
        sync: false
      # Restricted to SIMULATOR_ROLE on CREAttestationReceiver. Required only
      # for a wallet-authorized positive domain-control attestation.
      - key: CRE_SIMULATOR_PRIVATE_KEY
        sync: false
      # Base64-encoded ~/.cre credential and public context files used only by
      # the hosted non-interactive CRE simulator. Both are written to a
      # short-lived private HOME and removed after each authorization.
      - key: CRE_CREDENTIALS_BASE64
        sync: false
      - key: CRE_CONTEXT_BASE64
        sync: false
      # Protects the in-product Privy settlement action. This is never exposed
      # through a NEXT_PUBLIC variable or stored in the browser.
      - key: OPERATOR_SETTLEMENT_TOKEN
        sync: false
      - key: GRAPH_QUERY_URL
        value: https://api.studio.thegraph.com/query/1754808/adreceipt/0.0.1
      - key: GRAPH_MAX_BLOCK_LAG
        value: "20"
      - key: PLACEMENT_SETTLEMENT_ADDRESS
        value: 0x2fB6889Cc142C622a0479aF56b75B98beAeD3576

  - type: web
    name: adreceipt-web
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Anand-0037/adreceipt
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ask
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADRECEIPT_API_HOSTPORT
        fromService:
          type: web
          name: adreceipt-api
          property: hostport
