services:
  - type: web
    name: adreceipt-api
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Anand-0037/adreceipt
    branch: main
    buildCommand: >-
      mkdir -p .render/bin /tmp/adreceipt-bun &&
      curl -fsSL https://github.com/smartcontractkit/cre-cli/releases/download/v1.33.0/cre_linux_amd64_ldd2-35.tar.gz |
      tar -xz -C .render/bin &&
      mv .render/bin/cre_v1.33.0_linux_amd64 .render/bin/cre &&
      curl -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip -o /tmp/adreceipt-bun.zip &&
      unzip -q /tmp/adreceipt-bun.zip -d /tmp/adreceipt-bun &&
      cp /tmp/adreceipt-bun/bun-linux-x64/bun .render/bin/bun &&
      chmod +x .render/bin/cre .render/bin/bun &&
      npm --prefix backend ci &&
      cd cre/placement-authorization &&
      ../../.render/bin/bun install --no-save
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NETWORK
        value: sepolia
      - key: SEPOLIA_RPC_URL
        sync: false
      # Restricted to SIMULATOR_ROLE on CREAttestationReceiver. Required only
      # for a wallet-authorized positive domain-control attestation.
      - key: CRE_SIMULATOR_PRIVATE_KEY
        sync: false
      # Base64-encoded ~/.cre credential and public context files used only by
      # the hosted non-interactive CRE simulator. Both are written to a
      # short-lived private HOME and removed after each authorization.
      - key: CRE_CREDENTIALS_BASE64
        sync: false
      - key: CRE_CONTEXT_BASE64
        sync: false
      - key: CRE_CLI_PATH
        value: runtime-bin/cre
      # Protects the in-product Privy settlement action. This is never exposed
      # through a NEXT_PUBLIC variable or stored in the browser.
      - key: OPERATOR_SETTLEMENT_TOKEN
        sync: false
      - key: GRAPH_QUERY_URL
        value: https://api.studio.thegraph.com/query/1754808/adreceipt/0.0.1
      - key: GRAPH_MAX_BLOCK_LAG
        value: "20"
      - key: PLACEMENT_SETTLEMENT_ADDRESS
        value: 0x2fB6889Cc142C622a0479aF56b75B98beAeD3576

  - type: web
    name: adreceipt-web
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Anand-0037/adreceipt
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ask
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADRECEIPT_API_HOSTPORT
        fromService:
          type: web
          name: adreceipt-api
          property: hostport
